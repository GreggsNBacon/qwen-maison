<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16151d">
<title>maison</title>
<link rel="icon" href="/brand.png">
<style>
  :root { --bg:#16151d; --card:#201e2b; --line:#2f2c42; --text:#ecebf3; --muted:#9d99b3; --dim:#6f6b85; --accent:#8b6cff;
          --ok:#4cc38a; --warn:#e5b454; --bad:#e5534b; }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; } body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 12px 16px;
           background: #16151dee; backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header img { width: 30px; height: 30px; }
  .wm { font: 600 22px/1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .g { font-weight: 700; background: linear-gradient(100deg, #e8825f 0%, #c76ad8 50%, #7c5cff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pill { margin-left: auto; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: #4cc38a22; color: #8fe0b6; white-space: nowrap; }
  .pill.bad { background: #e5534b22; color: #ff9a94; }
  main { max-width: 900px; margin: 0 auto; padding: 14px 14px 40px; }
  h2 { font: 600 15px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: var(--muted); margin: 20px 4px 8px; text-transform: uppercase; letter-spacing: .06em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .tile .l { color: var(--dim); font-size: 12px; }
  .tile .v { font: 600 22px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; margin-top: 2px; }
  .tile .s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 5px; border-radius: 3px; background: #2c2a3c; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #7c5cff, #c76ad8); }
  .warn { background: #e5b45418; border: 1px solid #e5b45455; color: #f3d48f; border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 13.5px; }
  .launch { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .launch button { padding: 14px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text);
                   font-size: 15px; font-weight: 600; cursor: pointer; }
  .launch button.claude { background: #d97757; border-color: transparent; color: #fff; }
  .launch button.qwen { background: #7c5cff; border-color: transparent; color: #fff; }
  .launch button:disabled { opacity: .55; }
  .sess { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
          margin-bottom: 8px; color: var(--text); text-decoration: none; }
  .sess .t { font-weight: 600; }
  .sess .d { color: var(--muted); font-size: 12.5px; }
  .sess > div:first-child { min-width: 0; overflow: hidden; } .sess .d { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .sess .x { flex: 0 0 auto; margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 11.5px; padding: 3px 8px; border-radius: 999px; background: #2c2a3c; color: var(--muted); }
  .badge.idle { background: linear-gradient(100deg, #e8825f33, #7c5cff33); color: #e6dcff; }
  .badge.run { background: #4cc38a22; color: #8fe0b6; }
  .close { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 4px 9px; cursor: pointer; }
  .empty { color: var(--dim); padding: 6px 4px; }
  .h { display: flex; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #25233350; }
  .h .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; flex: 0 0 auto; }
  .h .d { color: var(--muted); font-size: 12.5px; }
  .meta { color: var(--dim); font-size: 12.5px; margin: 6px 4px 0; overflow-wrap: anywhere; }
  footer { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 12px; margin-top: 26px; padding: 0 4px; }
  footer button { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <img src="/brand.png" alt="">
  <div class="wm">m<span class="g">ai</span>son</div>
  <span class="pill" id="pill">connecting…</span>
</header>
<main>
  <h2>This PC</h2>
  <div class="grid" id="stats"></div>
  <div id="warn"></div>
  <div class="meta" id="meta"></div>

  <h2>Sessions</h2>
  <div id="sessions"><div class="empty">Loading…</div></div>

  <h2>Start</h2>
  <div class="launch">
    <button class="claude" data-kind="claude">Claude Code</button>
    <button class="qwen" data-kind="qwen">Qwen Code</button>
    <button data-kind="chat">Chat</button>
    <button data-kind="shell">PowerShell</button>
  </div>
  <div class="meta">New sessions open in maison on the PC too — it's the same session in both places.</div>

  <h2>Health</h2>
  <div id="health"></div>

  <footer><span id="ver"></span><button id="logout">Sign out this device</button></footer>
</main>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const tile = (l, v, s, pct) => `<div class="tile"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s)}</div>` +
    (pct == null ? '' : `<div class="bar"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>`) + `</div>`;
  const post = (url) => fetch(url, { method: 'POST', headers: { 'X-Maison': '1' } }).then(r => r.json());

  async function refresh() {
    let j;
    try {
      const r = await fetch('/api/state', { cache: 'no-store' });
      if (r.status === 401) { location.href = '/login'; return; }
      j = await r.json();
    } catch { $('pill').textContent = 'offline'; $('pill').className = 'pill bad'; return; }
    const ui = j.ui || {}, st = j.stats;
    $('pill').textContent = ui.status || '—';
    $('pill').className = 'pill' + (/ready/i.test(ui.status || '') ? '' : ' bad');
    $('ver').textContent = `maison ${j.app.version} · ${j.app.machine}`;

    let tiles = '';
    if (st) {
      if (st.gpu) {
        tiles += tile('GPU', `${st.gpu.load}%`, st.gpu.name.replace('NVIDIA GeForce ', ''), st.gpu.load);
        tiles += tile('GPU temp', st.gpu.temp != null ? `${Math.round(st.gpu.temp)}°C` : '—', st.gpu.power != null ? `${Math.round(st.gpu.power)} W` : '', st.gpu.temp);
        tiles += tile('VRAM', `${st.gpu.vramUsed} GB`, `of ${st.gpu.vramTotal} GB`, 100 * st.gpu.vramUsed / st.gpu.vramTotal);
      }
      tiles += tile('CPU', `${st.cpu}%`, st.cpuName, st.cpu);
      tiles += tile('RAM', `${st.ramUsed} GB`, `of ${st.ramTotal} GB`, 100 * st.ramUsed / st.ramTotal);
      tiles += tile('Ollama', `${st.ollamaCpu}% CPU`, `${st.ollamaRam} GB RAM`, null);
    }
    $('stats').innerHTML = tiles;
    $('warn').innerHTML = st && st.warning ? `<div class="warn">⚠ ${esc(st.warning)}</div>` : '';
    const loaded = (ui.loaded || []).map(m => `${m.name} (${m.gpu}% GPU)`).join(', ');
    $('meta').textContent = `Model ${ui.model || '—'} · context ${ui.context || '—'} · permissions: ${ui.permissions || '—'} · folder ${ui.folder || '—'}` + (loaded ? ` · loaded: ${loaded}` : '');

    const ss = j.sessions || [];
    $('sessions').innerHTML = ss.length === 0 ? '<div class="empty">No sessions running. Start one below.</div>' : ss.map(s => `
      <a class="sess" href="/term/${encodeURIComponent(s.id)}">
        <div><div class="t">${esc(s.title)}</div><div class="d">${esc(s.folder)}</div></div>
        <div class="x">
          <span class="badge ${!s.running ? '' : s.idle ? 'idle' : 'run'}">${!s.running ? 'ended' : s.idle ? 'idle' : 'working'}</span>
          <button class="close" data-close="${esc(s.id)}" title="End this session">✕</button>
        </div>
      </a>`).join('');

    const colors = { ok: 'var(--ok)', warn: 'var(--warn)', bad: 'var(--bad)', info: '#6ca0dc' };
    $('health').innerHTML = (ui.health || []).map(h => `<div class="h"><span class="dot" style="background:${colors[h.level] || '#888'}"></span>
      <div><div>${esc(h.title)}</div><div class="d">${esc(h.detail)}</div></div></div>`).join('');
  }

  document.addEventListener('click', async e => {
    const c = e.target.closest('[data-close]');
    if (c) { e.preventDefault(); if (confirm('End this session?')) { await post(`/api/sessions/${encodeURIComponent(c.dataset.close)}/close`); refresh(); } return; }
    const b = e.target.closest('[data-kind]');
    if (b) {
      b.disabled = true;
      try {
        const j = await post(`/api/launch/${b.dataset.kind}`);
        if (j.ok && j.id) location.href = `/term/${encodeURIComponent(j.id)}`; else alert(j.error || 'Could not start.');
      } finally { b.disabled = false; }
    }
  });
  $('logout').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    location.href = '/login';
  });
  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
