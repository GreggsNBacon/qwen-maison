<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- maison app icon: lowercase "ai" (Segoe UI Variable Display Bold) under a gradient roof; the i's own dot in coral. -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="90" y2="90">
      <stop offset="0" stop-color="#e8825f"/><stop offset=".5" stop-color="#c76ad8"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c36"/><stop offset="1" stop-color="#1b1c22"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#tile)"/>
  <path d="M18 41 L50 15 L82 41" fill="none" stroke="url(#g)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="50" y="83" text-anchor="middle" fill="#fff" font-family="Segoe UI Variable Display, Segoe UI" font-weight="700" font-size="58">a<tspan fill="#e8825f">i</tspan></text>
  <text x="50" y="83" text-anchor="middle" fill="#fff" font-family="Segoe UI Variable Display, Segoe UI" font-weight="700" font-size="58">a&#x131;</text>
</svg>
